<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>참부모론 해설 제1장 1. 하늘부모님의 본질</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1b2a; --bg2:#13283d; --ink:#f6f1e4; --muted:#b9c4d0;
    --gold:#e3b75b; --line:rgba(227,183,91,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  #deck{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,var(--bg2),var(--bg) 70%);}

  /* 슬라이드: 왼쪽 본문 + 오른쪽 핵심 한 줄 */
  .slide{position:absolute;inset:0;display:none;flex-direction:row;align-items:center;gap:4vw;
    padding:6vh 6vw 8vh;transform-origin:top center}
  .slide.active{display:flex;animation:fade .35s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .key{flex:0 0 27vw;align-self:center;border-left:6px solid var(--gold);
    background:rgba(227,183,91,.08);border-radius:0 1.2vw 1.2vw 0;padding:3.2vh 2vw}
  .key small{display:block;color:var(--gold);font-weight:700;letter-spacing:.14em;
    font-size:min(1.5vw,2.6vh);margin-bottom:1.8vh}
  .key p{margin:0;font-family:"Noto Serif KR","Batang",serif;font-weight:700;line-height:1.4;
    font-size:min(2.3vw,4vh);word-break:keep-all}

  .tag{font-size:min(1.9vw,3.3vh);color:var(--gold);font-weight:700;letter-spacing:.08em;margin-bottom:1.8vh}
  .ttl{font-family:"Noto Serif KR","Batang",serif;font-weight:700;font-size:min(2.5vw,4.3vh);line-height:1.3;
    color:var(--gold);margin:0 0 3vh;padding-bottom:2vh;border-bottom:2px solid var(--line);word-break:keep-all}
  .stmt{font-family:"Noto Serif KR","Batang",serif;font-weight:500;line-height:1.55;margin:0;
    word-break:keep-all;overflow-wrap:break-word}
  .s-s{font-size:min(3.2vw,5.6vh)}
  .s-m{font-size:min(2.8vw,4.8vh)}
  .s-l{font-size:min(2.4vw,4.2vh)}
  .s-xl{font-size:min(2.2vw,3.8vh)}
  .cite{margin-top:3.2vh;padding-left:1.4vw;border-left:4px solid var(--gold);
    font-size:min(1.7vw,3vh);line-height:1.55;color:var(--muted);word-break:keep-all}
  .cite b{color:var(--gold)}
  .cite div+div{margin-top:.8vh}


  /* 명제 슬라이드: 왼쪽 도식 + 오른쪽 명제·키워드 */
  .slide.diag{gap:3vw;padding:5vh 4vw 8vh}
  .fig{margin:0;flex:0 0 auto;width:min(56vw,98vh);background:#f7f9fc;border-radius:1vw;overflow:hidden;
    box-shadow:0 2vh 5vh rgba(0,0,0,.35)}
  .fig img{display:block;width:100%;height:auto}
  .side{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .diag .ttl{font-size:min(2.1vw,3.7vh);margin-bottom:2.4vh;padding-bottom:1.6vh}
  .core{border-left:5px solid var(--gold);background:rgba(227,183,91,.08);border-radius:0 1vw 1vw 0;padding:2vh 1.4vw;margin-bottom:2.6vh}
  .core small{display:block;color:var(--gold);font-weight:700;letter-spacing:.12em;font-size:min(1.2vw,2.1vh);margin-bottom:1vh}
  .core p{margin:0;font-family:"Noto Serif KR","Batang",serif;font-weight:700;line-height:1.45;font-size:min(1.9vw,3.4vh);word-break:keep-all}
  .kw{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:1.2vh .7vw}
  .kw li{border:1px solid var(--line);border-radius:999px;padding:.8vh 1vw;font-size:min(1.5vw,2.7vh);font-weight:500;color:var(--ink);
    background:rgba(255,255,255,.04);word-break:keep-all}
  .diag .cite{margin-top:2.4vh;font-size:min(1.3vw,2.3vh)}

  /* 표지 */
  .cover h1{font-family:"Noto Serif KR",serif;font-size:min(4.3vw,7.5vh);line-height:1.28;margin:0 0 3vh;
    color:var(--gold);word-break:keep-all}
  .cover .small{font-size:min(2vw,3.5vh);color:var(--muted);margin-bottom:3vh}
  .cover .sub{font-family:"Noto Serif KR",serif;font-size:min(2.4vw,4.2vh);margin-bottom:5vh}
  .cover .hint{font-size:min(1.4vw,2.4vh);color:var(--muted)}

  /* 구분 */
  .divider .big{font-family:"Noto Serif KR",serif;font-size:min(5.6vw,9.6vh);font-weight:700;color:var(--gold);line-height:1;margin-bottom:2.5vh}
  .divider h2{font-family:"Noto Serif KR",serif;font-size:min(3.7vw,6.4vh);line-height:1.3;margin:0 0 3vh;word-break:keep-all}
  .divider .rng{font-size:min(2.2vw,3.8vh);color:var(--muted)}

  /* 하단 표시 */
  #bar{position:fixed;left:0;bottom:0;height:.8vh;background:var(--gold);width:0;transition:width .3s;z-index:5}
  #cnt{position:fixed;right:2.2vw;bottom:2.2vh;font-size:min(1.5vw,2.6vh);color:var(--muted)}
  #sec{position:fixed;left:2.2vw;bottom:2.2vh;font-size:min(1.5vw,2.6vh);color:var(--muted)}

  #home{position:fixed;left:2.2vw;top:2vh;z-index:6;font-size:min(1.4vw,2.4vh);color:var(--muted);
    text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:.6vh 1.2vw;opacity:.55}
  #home:hover{opacity:1;color:var(--gold)}
  #openP{position:fixed;right:2.2vw;top:2vh;z-index:6;font:inherit;font-size:min(1.4vw,2.4vh);color:var(--muted);
    background:transparent;border:1px solid var(--line);border-radius:999px;padding:.6vh 1.2vw;opacity:.55;cursor:pointer}
  #openP:hover{opacity:1;color:var(--gold)}
  /* 청중 화면에서 마우스를 3초간 움직이지 않으면 버튼 숨김 */
  body.idle #home,body.idle #openP{opacity:0;pointer-events:none}
  body.idle{cursor:none}
  /* 발표자 창 안의 미리보기(iframe)용 — 조작 요소 없음 */
  body.view #home,body.view #openP{display:none}

  /* ── 발표자 창 ── */
  body.presenter{overflow:auto}
  body.presenter #deck,body.presenter #sec,body.presenter #cnt,body.presenter #bar,
  body.presenter #home,body.presenter #openP{display:none}
  #pv{display:none}
  body.presenter #pv{display:grid;min-height:100vh;padding:14px;gap:14px;
    grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);
    grid-template-areas:"hd hd" "cur side" "note note";background:var(--bg)}
  #pvhd{grid-area:hd;display:flex;gap:12px 22px;flex-wrap:wrap;align-items:center;font-size:15px;color:var(--muted)}
  #pvhd .clock{font-family:"Noto Serif KR",serif;font-size:34px;color:var(--ink);font-weight:700;letter-spacing:.02em}
  #pvhd .pos{font-size:20px;color:var(--gold);font-weight:700}
  #pvhd .late{color:#ff9d8a;font-weight:700} #pvhd .ok{color:#9be0b0;font-weight:700}
  #pvhd .sp{flex:1}
  .pbtn{font:inherit;font-size:14px;color:var(--ink);background:#13283d;border:1px solid var(--line);
    border-radius:8px;padding:7px 12px;cursor:pointer}
  .pbtn:hover{border-color:var(--gold)}
  .pbtn.on{background:var(--gold);color:#1a1405;font-weight:700}
  .frame{position:relative;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000}
  .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
  .lbl{font-size:13px;color:var(--gold);font-weight:700;letter-spacing:.1em;margin:0 0 6px}
  #pvcur{grid-area:cur;min-width:0}
  #pvside{grid-area:side;min-width:0;display:flex;flex-direction:column;gap:14px}
  #pvnextkey{font-size:15px;color:var(--muted);line-height:1.5}
  #pvnote{grid-area:note;min-height:24vh;background:#07111c;border:1px solid var(--line);border-top:3px solid var(--gold);
    border-radius:8px;padding:16px 20px;overflow:auto;line-height:1.7;word-break:keep-all;color:var(--ink)}
  #pvconn{font-size:13px}
  #pvconn.off{color:#ff9d8a} #pvconn.on{color:#9be0b0}
</style>
</head>
<body>
<a id="home" href="./" title="강의 목록 (H)">← 강의 목록</a>
<div id="deck"></div>
<div id="sec"></div>
<div id="cnt"></div>
<div id="bar"></div>
<button id="openP" type="button" title="발표자 창 열기 (P)">발표자 창 열기</button>
<div id="pv">
  <div id="pvhd"></div>
  <div id="pvcur"><p class="lbl">현재 슬라이드 · 청중 화면</p><div class="frame"><iframe id="fcur" title="현재 슬라이드" tabindex="-1"></iframe></div></div>
  <div id="pvside">
    <div><p class="lbl">다음 슬라이드</p><div class="frame"><iframe id="fnext" title="다음 슬라이드" tabindex="-1"></iframe></div></div>
    <div id="pvnextkey"></div>
  </div>
  <div id="pvnote"></div>
</div>

<script>
const SECTIONS = [
  {n:"1)", t:"하나님은 창조주 하늘부모님", r:"명제 01 – 04"},
  {n:"2)", t:"하늘부모님의 심정", r:"명제 05 – 07"},
  {n:"3)", t:"부모 격위와 성품", r:"명제 08 – 13"},
  {n:"4)", t:"성상과 형상", r:"명제 14 – 17"},
  {n:"5)", t:"로고스와 창조성", r:"명제 18 – 21"}
];

/* 명제 슬라이드: img = 도식(img/chambumo-1-1/1-NN.webp), key = 핵심 명제, kw = 키워드
   도식 출처: 참부모론 명제&도식 자료실 (chambumo-diagrams) */
const S = [
 {type:"cover", key:"창조주를 넘어, 부모이신 하나님",
  note:`안녕하십니까. 오늘은 『참부모론 해설』 제1장 첫 절, ‘하늘부모님의 본질’을 함께 살펴보겠습니다. 스물한 개의 명제를 도식과 함께 하나씩 보겠습니다. 화면의 도식을 따라가시면 말씀의 흐름이 한눈에 들어오실 겁니다. 다섯 개의 항을 지나, 마지막에 오늘 꼭 가져가실 한 가지를 말씀드리겠습니다.`},

 {type:"divider", sec:0, key:"근원은 하나, 그분은 우리의 부모",
  note:`첫째 항입니다. 하나님은 창조주 하늘부모님이십니다. 모든 것의 근원을 찾아 올라가, 그분이 누구신지 확인하는 대목입니다.`},
 {type:"prop", sec:0, n:1, title:"원인 없는 결과란 없다",
  key:"모든 것은 결과이고, 원인을 거슬러 올라가면 하나의 최초 원인에 이른다",
  kw:["결과","원인","궁극적 원인자","그 본체는 누구신가?"],
  note:`도식을 위에서부터 따라가 보겠습니다. 우리 눈앞에 있는 모든 것은 ‘결과’입니다. 이 꽃도, 이 책상도, 우리 자신도 스스로 생겨난 것은 없습니다. 그러면 묻게 됩니다. 그 원인은 무엇인가? 원인을 찾으면 그 원인에게도 또 원인이 있습니다. 이렇게 계속 거슬러 올라가면, 결국 더 이상 위가 없는 하나의 최초 원인, 곧 궁극적 원인자에 이르게 됩니다. 도식 맨 아래의 질문이 오늘 강의 전체의 질문입니다. ‘그 궁극적 본체는 누구신가?’ 이 질문을 마음에 품고 다음 명제로 넘어가겠습니다.`},
 {type:"prop", sec:0, n:2, title:"궁극적 원인자는 하나이며 창조주 하늘부모님이시다",
  key:"문명마다 다른 이름으로 불렀으나 근원은 하나이며, 그분은 인류를 낳은 분이다",
  kw:["여러 이름","하나의 신","인류를 낳아 주신 분","창조주 하늘부모님"],
  note:`사람들은 그 궁극적 원인자를 문명마다 다른 이름으로 불러 왔습니다. 도식 위쪽을 보십시오. 야훼, 엘로힘, 갓, 알라, 하늘, 상제, 브라만, 도. 이름은 여럿이지만 선들이 모두 한 점으로 모입니다. 궁극적 근원은 둘이 될 수 없기 때문입니다. 그래서 결국 하나의 신을 가리킵니다. 그러면 그 하나의 신은 어떤 분입니까? 우주를 창조하시고 전 인류를 낳아 주신 분입니다. 나를 낳아 준 분을 우리는 부모라고 부릅니다. 그래서 그분을 ‘창조주 하늘부모님’이라 부르는 것이 가장 자연스럽습니다.`},
 {type:"prop", sec:0, n:3, title:"하나님은 인류의 하늘부모님",
  key:"만물은 상징적으로, 인간은 실체적으로 하늘부모님을 닮았다",
  kw:["하늘아버지 · 하늘어머니","인간 — 실체적 닮음","만물 — 상징적 닮음","부모와 자녀"],
  q:[["창 1:27","자기 형상 곧 하나님의 형상대로 사람을 창조하시되 남자와 여자를 창조하시고"]],
  note:`이 도식은 일종의 가계도입니다. 맨 위에 하늘부모님이 계시고, 그 안의 하늘아버지와 하늘어머니를 닮아 남자와 여자가 지어졌습니다. 창세기 1장 27절, ‘하나님이 자기 형상 곧 하나님의 형상대로 사람을 창조하시되 남자와 여자를 창조하시고.’ 점선 아래를 보십시오. 만물도 암과 수, 수술과 암술, 양이온과 음이온처럼 쌍을 이룹니다. 만물은 하늘부모님을 상징적으로 닮았습니다. 그러나 인간은 실체적으로 닮았습니다. 왜 인간이 가장 닮았습니까? 자녀로 창조되었기 때문입니다. 그래서 하늘부모님과 인간은 가장 친밀한 관계, 부모와 자녀의 관계입니다.`},
 {type:"prop", sec:0, n:4, title:"하늘부모님 아래 인류 한 가족",
  key:"하늘부모님이 온 인류의 부모이므로 사람과 사람은 형제자매다",
  kw:["온 인류의 부모","형제자매","고아처럼 살아온 인류","인류 한 가족"],
  note:`맨 위에 온 인류의 부모이신 하늘부모님이 계십니다. 그 아래 동그라미 하나하나가 우리 한 사람 한 사람입니다. 모두 같은 부모에게 이어져 있습니다. 그리고 동그라미끼리 점선으로 이어져 있습니다. 모두가 그분의 자녀라면, 사람과 사람은 형제자매입니다. 도식 맨 아래 문장을 보십시오. ‘인류는 그분을 모른 채 고아처럼 살아왔다.’ 부모를 모르니 형제도 알아보지 못했습니다. 이제 부모를 찾았으니, 서로 온정을 베풀며 위하는 삶, 곧 ‘하늘부모님 아래 인류 한 가족’을 이루어야 합니다.`},

 {type:"divider", sec:1, key:"사랑하고픈 심정이 창조의 동기",
  note:`둘째 항, 하늘부모님의 심정입니다. 하늘부모님이 어떤 분이신지, 그 마음 깊은 곳을 들여다보는 대목입니다.`},
 {type:"prop", sec:1, n:5, title:"하늘부모님은 사랑이시다",
  key:"참사랑은 절대·유일·불변·영원하며 주고 잊고 또 주는 사랑이다",
  kw:["절대 · 유일 · 불변 · 영원","주고 → 잊고 → 또 주고","참사랑"],
  q:[["요일 4:16","하나님은 사랑이시라"]],
  note:`하늘부모님의 속성은 곧 사랑의 속성입니다. 그 사랑을 참사랑이라 부릅니다. 도식의 네 칸, 절대, 유일, 불변, 영원입니다. 요한일서 4장 16절, ‘하나님은 사랑이시라.’ 그 사랑은 어떤 사랑입니까? 아래 화살표를 보십시오. 주고, 잊고, 또 줍니다. 그리고 점선 화살표가 다시 처음으로 돌아갑니다. 끝없이 이어지는 사랑입니다. 아기에게 젖을 물리는 어머니가 얼마나 주었는지 세지 않는 것과 같습니다. 이 사랑은 변하지 않기에 시작과 끝이 같고, 세우신 뜻을 반드시 이루십니다.`},
 {type:"prop", sec:1, n:6, title:"참사랑의 근원인 심정",
  key:"심정은 마르지 않는 샘이고 참사랑은 그 샘에서 나오는 생명수다",
  kw:["심정 — 마르지 않는 샘","참사랑 — 생명수","사랑할수록 깊어짐"],
  q:[["요 4:14","나의 주는 물은 그 속에서 영생하도록 솟아나는 샘물이 되리라"]],
  note:`그러면 그 참사랑은 어디서 나옵니까? 도식 위쪽 상자, 심정입니다. 심정은 한없이 사랑하고 그 사랑으로 기쁨을 얻고자 하는 정적(情的) 충동입니다. 심정은 마르지 않는 샘이고, 참사랑은 그 샘에서 솟아나는 생명수입니다. 오른쪽 점선 화살표를 보십시오. 생명수가 흘러나가면 샘이 마르는 것이 아니라, 사랑할수록 샘이 더 깊어집니다. 요한복음 4장 14절, ‘나의 주는 물은 그 속에서 영생하도록 솟아나는 샘물이 되리라.’ 상대를 위해서라면 모든 것을 투입하고 또 투입하고 싶은 마음, 하늘부모님조차 억누르기 어려울 만큼 무한하고 절대적인 마음, 그것이 심정입니다.`},
 {type:"prop", sec:1, n:7, title:"심정은 창조의 동기",
  key:"사랑엔 상대가 있어야 하므로 상대를 염원한 심정이 창조의 동기가 되었다",
  kw:["사랑의 상대","창조의 동기","자녀 — 인간","천주 — 함께 살 집","창조는 필연"],
  note:`도식 맨 위, ‘하늘부모님 — 홀로’. 사랑은 혼자서 이룰 수 없습니다. 반드시 상대가 있어야 합니다. 그래서 하늘부모님은 사랑의 상대를 간절히 염원하셨습니다. 그 염원하는 심정이 바로 창조의 동기입니다. 그 심정에서 두 갈래가 나옵니다. 왼쪽은 사랑의 상대인 자녀, 곧 인간이고, 오른쪽은 자녀와 함께 살 집, 천주입니다. 그러니 작은 돌멩이부터 온 우주까지 모든 존재의 목적도 사랑입니다. 창조는 우연이 아니라, 사랑하고 싶은 심정에서 나온 필연입니다.`},

 {type:"divider", sec:2, key:"한 분이시되 두 격위",
  note:`셋째 항, 부모 격위와 성품입니다. 하늘부모님이 왜 ‘부모’이신지, 그 구조를 여섯 개의 도식으로 살펴보겠습니다.`},
 {type:"prop", sec:2, n:8, title:"자녀 탄생을 위해선 부모가 필요",
  key:"자녀는 아버지와 어머니가 함께 있어야 태어나므로 하늘부모님도 두 격위로 계신다",
  kw:["아버지 + 어머니 → 자녀","하늘아버지 + 하늘어머니","잉태·출산의 노정"],
  note:`도식 위쪽은 우리 가정의 모습입니다. 아버지와 어머니가 함께 있어야 자녀가 태어납니다. 혼자서는 낳을 수 없습니다. 그렇다면 점선 아래, 인류의 부모이신 하늘부모님도 마찬가지입니다. 하늘아버지와 하늘어머니, 두 분 사랑의 결실로 인간이 태어났습니다. 맨 아래 문장을 보십시오. 천지창조부터 인간 탄생까지의 긴 시간은, 자녀를 낳기 위한 잉태와 출산의 노정이었다고 볼 수 있습니다.`},
 {type:"prop", sec:2, n:9, title:"당신의 형상대로 (Imago Dei)",
  key:"하나님의 형상은 남성격위와 여성격위이며, 그것을 실체로 나눈 피조물을 분성실체라 한다",
  kw:["Imago Dei","남성격위 · 여성격위","분성실체(分性實體)","저차원 — 상징적 · 고차원 — 실체적"],
  q:[["창 1:27","하나님이 자기 형상 곧 하나님의 형상대로 사람을 창조하시되 남자와 여자를 창조하시고"]],
  note:`창세기의 ‘자기 형상대로’, 라틴어로 이마고 데이입니다. 도식은 하나님의 형상이 무엇인지 보여 줍니다. 하나님의 형상은 남성격위와 여성격위입니다. 그것이 실체로 나뉘어 남자와 여자가 되었습니다. 이렇게 하늘부모님의 격위와 성품을 실체로 나누어 지은 피조물을 분성실체라 합니다. 점선 아래를 보십시오. 그래서 만물은 쌍을 이루어 사랑을 주고받습니다. 저차원의 존재는 상징적으로, 고차원으로 갈수록 형상적·실체적으로 하늘부모님을 닮습니다.`},
 {type:"prop", sec:2, n:10, title:"아버지격위와 어머니격위",
  key:"두 신이 있는 것이 아니라 한 분에게 두 격위가 있다",
  kw:["두 신 ✗","한 분에게 두 격위 ✓","하늘아버지인 동시에 하늘어머니","신의 모성"],
  q:[["신 32:18","너를 낳은 반석"],["사 66:13","어미가 자식을 위로함 같이"],["마 23:37","암탉이 그 새끼를 날개 아래에 모음 같이"]],
  note:`오해하기 쉬운 부분이라 도식을 두 쪽으로 나눴습니다. 왼쪽, 신이 둘 있는 것이 아닙니다. 오른쪽, 한 분에게 아버지 격위와 어머니 격위, 두 격위가 있는 것입니다. 하늘부모님은 그 자체로 온전히 하늘아버지인 동시에 하늘어머니이시고, 자녀인 우리의 관점에서 두 격위로 나타나십니다. 유일신 종교들은 대개 신을 남성으로 이해해 왔습니다. 그러나 경전에도 신의 모성을 표현한 구절이 분명히 있습니다. 신명기 32장 18절 ‘너를 낳은 반석’, 이사야 66장 13절 ‘어미가 자식을 위로함 같이’, 마태복음 23장 37절 ‘암탉이 그 새끼를 날개 아래에 모음 같이’입니다.`},
 {type:"prop", sec:2, n:11, title:"격위와 성품",
  key:"격위와 성품은 겉과 속처럼 떼어 놓을 수 없어 구분되지만 분리되지 않는다",
  kw:["표리일체(表裏一體)","격위(位) · 성품(性)","부성 + 모성","구분되나 분리되지 않음"],
  note:`격위와 성품은 겉과 속처럼 떼어 놓을 수 없습니다. 이것을 표리일체라 합니다. 도식의 두 줄을 보십시오. 하늘아버지 격위에는 남성적 성품이, 하늘어머니 격위에는 여성적 성품이 있습니다. 그래서 하늘부모님은 부성과 모성이 하나 된 본체이십니다. 핵심은 가운데 문장입니다. 구분할 수는 있어도 분리할 수는 없습니다. 하늘아버지로 나타나셔도 그 안에 하늘어머니가 하나 되어 계시고, 하늘어머니로 나타나셔도 그 안에 하늘아버지가 하나 되어 계십니다.`},
 {type:"prop", sec:2, n:12, title:"양성과 음성",
  key:"고차원에서는 성별로, 저차원에서는 존재의 속성으로 나타난다",
  kw:["고차원 — 남·수 / 여·암","저차원 — 양이온 / 음이온","수수작용"],
  note:`하늘부모님의 부성과 모성이 실체로 나뉘어 세계가 창조되었습니다. 도식은 그것이 차원에 따라 어떻게 나타나는지 보여 줍니다. 위쪽 고차원에서는 남과 여, 수컷과 암컷처럼 성별로 나타납니다. 아래쪽 저차원에서는 양이온과 음이온처럼 존재의 속성으로 나타납니다. 둘 사이를 잇는 곡선이 수수작용입니다. 서로 주고받으며 관계를 맺습니다. 한 가지 구분할 점이 있습니다. 남녀의 남성·여성은 전체적 속성이고, 마음과 몸의 양성·음성은 능동적·수동적 측면입니다. 이 둘은 구분해서 이해해야 합니다.`},
 {type:"prop", sec:2, n:13, title:"한 분이신 하늘부모님",
  key:"아버지와 어머니를 어버이라 하나로 부르듯 두 격위가 한 분이다",
  kw:["참사랑의 심정 중심","아버지 + 어머니 → 어버이","한 분이신 하늘부모님"],
  note:`두 격위라면 결국 두 분이냐는 질문이 남습니다. 도식 위쪽, 하늘아버지 격위와 하늘어머니 격위가 참사랑의 심정을 중심으로 완전히 하나 되어, 한 분이신 하늘부모님이 되십니다. 우리말에 좋은 예가 있습니다. ‘어버이’입니다. 아버지와 어머니, 두 분이 계셔도 자녀는 하나의 존재로 부릅니다. 이처럼 우리는 하늘아버지와 하늘어머니로 구분해 경험하더라도, 본체에 있어서는 한 분이심을 체휼할 수 있습니다. 구분되지만 분리되지 않습니다.`},

 {type:"divider", sec:3, key:"마음과 몸 — 성상과 형상",
  note:`넷째 항, 성상과 형상입니다. 하늘부모님의 내면 구조, 곧 마음과 몸에 해당하는 부분을 살펴보겠습니다.`},
 {type:"prop", sec:3, n:14, title:"성상과 형상을 닮은 피조세계",
  key:"하늘부모님은 심정을 기반으로 성상과 형상을 갖춘 인격적 존재이시다",
  kw:["심정 — 바탕","성상(性相) — 마음","형상(形狀) — 몸","인격적 존재"],
  note:`이제 하늘부모님의 내면 구조로 들어갑니다. 맨 위, 심정이 바탕입니다. 그 아래 성상과 형상이 있습니다. 성상은 내적이고 기능적인 측면, 인간으로 치면 마음입니다. 형상은 외형적이고 물질적인 측면, 인간으로 치면 몸입니다. 그래서 하늘부모님은 무한한 힘만 가진 존재가 아니라, 정·지·의의 마음을 갖추신 인격적 존재이십니다. 점선 아래를 보십시오. 그분을 닮아 모든 존재도 예외 없이 성상과 형상의 통일체로 존재합니다.`},
 {type:"prop", sec:3, n:15, title:"하늘부모님의 본성상",
  key:"심정을 터로 정·지·의가 발현되고 각각 미·진·선의 가치가 세워진다",
  kw:["심정 — 터","정 → 미","지 → 진","의 → 선"],
  note:`하늘부모님의 성상을 본성상이라 합니다. 만유 성상의 근원이라는 뜻입니다. 도식 맨 위, 심정이 터입니다. 그 터에서 정·지·의 세 기능이 나옵니다. 정은 희로애락을 느끼는 능력, 지는 감성·오성·이성의 인식 능력, 의는 욕구하고 결단하는 능력입니다. 그리고 각각을 채우는 궁극적 가치가 아래에 있습니다. 정은 미, 지는 진, 의는 선입니다. 정·지·의는 모두 심정에서 나와 사랑하는 상대를 위해 쓰입니다. 그래서 사랑할수록 상대가 더 아름답고, 더 참되고, 더 선하게 보입니다.`},
 {type:"prop", sec:3, n:16, title:"무형의 하늘부모님도 꼴이 있으시다",
  key:"본성상 안에 관념·개념·원칙·수리라는 마음의 꼴이 있다",
  kw:["관념","개념","원칙","수리","심상(心相) — 마음의 꼴"],
  note:`하늘부모님은 무형이십니다. 그러나 마음속에는 꼴이 있습니다. 이것을 심상, 마음의 꼴이라 합니다. 도식의 네 칸입니다. 관념은 피조물 하나하나의 구체적 표상입니다. 개념은 여러 관념의 공통 요소를 추상한 표상입니다. 예를 들어 여러 가지 의자 하나하나는 관념이고, 거기서 ‘사람이 앉는 물건’이라는 공통점을 뽑으면 개념이 됩니다. 원칙은 자연법칙과 규범법칙의 근본 원인이고, 수리는 수적 현상의 궁극적 원인입니다. 모두 정·지·의 기능의 결과로 생긴 마음의 꼴입니다.`},
 {type:"prop", sec:3, n:17, title:"하늘부모님의 본형상",
  key:"본형상은 하늘부모님의 보이지 않는 몸으로 모든 유형적 요소의 근원이다",
  kw:["본형상(本形狀)","보이지 않는 몸","몸 · 육 · 세포 · 원자","본성상과 본형상의 통일"],
  note:`이번에는 하늘부모님의 형상, 본형상입니다. 본형상은 하늘부모님의 보이지 않는 몸과 같습니다. 도식 가운데 네 칸, 인간의 몸, 동물의 육, 식물의 조직과 세포, 광물의 분자와 원자, 이 모든 유형적 요소의 근원이 본형상입니다. 점선 아래를 보십시오. 기존 유일신 종교는 신을 물질과 무관한 영으로만 이해했기에 ‘무에서 창조’를 말했습니다. 그러나 하늘부모님은 본성상과 본형상이 하나로 통일된 분이십니다. 그래서 세계의 형상은 본형상을 닮아 창조되었습니다.`},

 {type:"divider", sec:4, key:"청사진과 질서",
  note:`마지막 다섯째 항, 로고스와 창조성입니다. 하늘부모님이 어떤 질서와 순서로 세계를 지으셨는지 보겠습니다.`},
 {type:"prop", sec:4, n:18, title:"로고스란?",
  key:"로고스는 하늘부모님의 사유이자 말씀이며 피조세계의 설계도다",
  kw:["말씀(Word)","로고스","설계도 · 청사진","피조세계"],
  q:[["요 1:1","태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라"]],
  note:`요한복음 1장 1절, ‘태초에 말씀이 계시니라.’ 도식을 위에서 아래로 따라가겠습니다. 첫째, 말씀입니다. 이 말씀의 헬라어 원어가 로고스이고, 말, 언어, 이성, 의미, 원리, 질서라는 뜻을 다 품고 있습니다. 둘째, 로고스는 하늘부모님의 사유이자 말씀입니다. 셋째, 특히 세계를 창조하시려고 세우신 구상, 곧 피조세계의 설계도, 청사진입니다. 넷째, 그 설계도대로 피조세계가 지어졌습니다. 건축가가 집을 짓기 전에 설계도를 먼저 그리는 것과 같습니다.`},
 {type:"prop", sec:4, n:19, title:"이성과 법칙의 통일 (이법)",
  key:"기차가 레일 위에서만 자유로이 달리듯 자유성과 필연성이 통일된다",
  kw:["기차 — 자유성","레일 — 필연성","이법(理法)","법칙 안의 참된 자유"],
  note:`로고스는 이성과 법칙이 통일되어 있어 이법이라고도 합니다. 도식은 레일 위의 기차입니다. 기차는 이성적 요소, 곧 자유성입니다. 레일은 법칙적 요소, 곧 필연성입니다. 자유와 법칙은 모순처럼 보이지만, 기차는 레일 위에서만 자유롭게 달립니다. 레일을 벗어나면 달릴 수 없습니다. 고차원 존재일수록 자유적 요소가 강하고, 저차원일수록 필연성이 강합니다. 인간도 마찬가지입니다. 법칙에 순응해 창조목적을 실현할 때 참된 자유를 누립니다.`},
 {type:"prop", sec:4, n:20, title:"이법의 하늘부모님",
  key:"전기가 전선을 따라서만 흐르듯 참사랑은 이법을 통해 실현된다",
  kw:["참사랑 → 실현","로고스 = 사랑이 흐르는 길","심정이자 이법의 하늘부모님","바꾸지 않으시는 법칙"],
  note:`도식 왼쪽에 참사랑, 오른쪽에 실현이 있습니다. 그 사이를 잇는 선이 이법, 곧 질서입니다. 전기가 규칙적으로 배열된 전선을 따라서만 흐르듯, 로고스는 사랑이 흐르는 길입니다. 하늘부모님은 무조건적 사랑을 베푸시되 아무렇게나 발현하지 않으시고, 무한히 자유로우시되 질서 없이 자유를 쓰지 않으십니다. 그래서 하늘부모님은 심정의 하늘부모님이시자 이법의 하늘부모님이십니다. 세우신 법칙은 절대·불변·영원하여, 창조 이후에는 하늘부모님도 마음대로 바꾸지 않으십니다. 부모와 자녀, 부부, 형제자매 사이의 사랑의 질서도 그렇습니다.`},
 {type:"prop", sec:4, n:21, title:"하늘부모님의 창조성",
  key:"창조는 구상(내적 창조)과 실체(외적 창조)의 두 단계로 이루어진다",
  kw:["심정 → 창조목적 → 로고스 → 세계","내적 창조 — 구상","외적 창조 — 실체","창조성"],
  note:`마지막 도식은 창조의 순서입니다. 먼저 내적 창조, 곧 구상입니다. 사랑의 상대를 염원하는 심정을 동기로 창조목적을 세우시고, 그 목적을 중심으로 마음속에 청사진인 로고스를 창조하셨습니다. 그다음이 외적 창조, 곧 실체입니다. 그 구상의 토대 위에 본형상을 투입해 세계를 창조하셨습니다. 심정, 창조목적, 로고스, 세계. 이 순서를 기억해 주십시오. 인간의 과학, 예술, 건축, 농업 같은 창조성의 근원도 바로 하늘부모님의 창조성에 있습니다. 하늘부모님은 무한히 창조하시는 분이십니다.`},

 {type:"closing", key:"하늘부모님 아래 인류 한 가족",
  title:"오늘의 한 가지",
  stmt:"하나님은 단순한 창조주가 아니라, 우리의 부모이시다.",
  note:`오늘 말씀을 한 문장으로 줄이면 이렇습니다. 하나님은 단순한 창조주가 아니라 우리의 부모이십니다. 그 심정에서 참사랑이 나왔고, 그 사랑의 상대로 우리가 태어났으며, 그 사랑은 이법이라는 질서를 따라 흐릅니다. 하늘부모님을 부모로 모신다면 우리는 서로 형제자매입니다. 이 한 가지를 오늘 가져가시기 바랍니다. 감사합니다.`}
];

/* 배정 시간: 원고 길이로 어림(1초에 약 6자) */
let acc = 0;
S.forEach(s=>{ s.time = Math.max(15, Math.round(s.note.length/6/5)*5); s.start = acc; acc += s.time; s.end = acc; });
const TOTAL = acc;

const pad = n => String(n).padStart(2,"0");
const fmt = sec => { sec = Math.max(0, Math.round(sec)); return Math.floor(sec/60) + ":" + pad(sec%60); };

const deck = document.getElementById("deck");
S.forEach(s=>{
  const el = document.createElement("section");
  el.className = "slide";
  let main = "";
  if(s.type==="prop"){
    const d = SECTIONS[s.sec];
    el.classList.add("diag");
    el.dataset.sec = d.n + " " + d.t;
    const cite = (s.q||[]).map(([r,t])=>`<div><b>${r}</b> 「${t}」</div>`).join("");
    el.innerHTML = `
      <figure class="fig"><img src="img/chambumo-1-1/1-${pad(s.n)}.webp" alt="명제 ${pad(s.n)} 도식: ${s.title}"></figure>
      <div class="side">
        <div class="tag">명제 ${pad(s.n)}</div>
        <h2 class="ttl">${s.title}</h2>
        <div class="core"><small>핵심 명제</small><p>${s.key}</p></div>
        <ul class="kw">${s.kw.map(k=>`<li>${k}</li>`).join("")}</ul>
        ${cite?`<div class="cite">${cite}</div>`:""}
      </div>`;
    deck.appendChild(el);
    return;
  }
  if(s.type==="cover"){
    el.classList.add("cover");
    main = `
      <div class="small">명제 &amp; 도식 강의</div>
      <h1>『참부모론 해설』<br>제1장 하늘부모님과 창조</h1>
      <div class="sub">1. 하늘부모님의 본질</div>
      <div class="hint">← → 넘김 · F 전체화면 · P 발표자 창 · H 목록</div>`;
  }else if(s.type==="divider"){
    const d = SECTIONS[s.sec];
    el.classList.add("divider");
    el.dataset.sec = d.n + " " + d.t;
    main = `<div class="big">${d.n}</div><h2>${d.t}</h2><div class="rng">${d.r}</div>`;
  }else{
    main = `
      <div class="tag">정리</div>
      <h2 class="ttl">${s.title}</h2>
      <p class="stmt s-s">${s.stmt}</p>`;
  }
  el.innerHTML = `<div class="main">${main}</div><aside class="key"><small>핵심 한 줄</small><p>${s.key}</p></aside>`;
  deck.appendChild(el);
});

const els = [...document.querySelectorAll(".slide")];
const cnt = document.getElementById("cnt"), bar = document.getElementById("bar"), secEl = document.getElementById("sec");
const $ = id => document.getElementById(id);

/* 화면 종류: audience(청중 화면) · presenter(발표자 창) · view(발표자 창 안의 미리보기) */
const Q = new URLSearchParams(location.search);
const MODE = Q.has("presenter") ? "presenter" : Q.has("view") ? "view" : "audience";
document.body.classList.add(MODE);
const FILE = location.pathname.split("/").pop() || "index.html";
let cur = 0;

/* 창 사이 연동 — 같은 강의의 청중 화면과 발표자 창이 서로 슬라이드 번호를 주고받음 */
let pwin = null, bc = null, linked = false;
try{ bc = new BroadcastChannel("deck:" + location.pathname); bc.onmessage = e => onMsg(e.data); }catch(e){}
function send(msg){
  try{ bc && bc.postMessage(msg); }catch(e){}
  [window.opener, pwin].forEach(w => { try{ if(w && !w.closed && w !== window) w.postMessage({deck:msg}, "*"); }catch(e){} });
}
addEventListener("message", e => {
  if(e.data && e.data.deck && (e.source === window.opener || e.source === pwin)) onMsg(e.data.deck);
});
function onMsg(m){
  if(!m || MODE === "view") return;
  linked = true;
  if(m.type === "go") show(m.i, true);
  else if(m.type === "hello") send({type:"go", i:cur});
  if(MODE === "presenter") renderConn();
}

function show(i, fromPeer){
  cur = Math.max(0, Math.min(els.length-1, i|0));
  if(MODE === "presenter") renderPresenter();
  else{
    els.forEach((e,k)=>e.classList.toggle("active", k===cur));
    cnt.textContent = (cur+1) + " / " + els.length;
    bar.style.width = ((cur+1)/els.length*100) + "%";
    secEl.textContent = els[cur].dataset.sec || "";
  }
  if(MODE !== "view"){
    history.replaceState(null, "", location.search + "#" + (cur+1));
    if(!fromPeer) send({type:"go", i:cur});
  }
}
const next = ()=>show(cur+1), prev = ()=>show(cur-1);
const NAV_NEXT = ["ArrowRight","ArrowDown","PageDown"," ","Enter"], NAV_PREV = ["ArrowLeft","ArrowUp","PageUp","Backspace"];
function navKey(e){
  const k = e.key;
  if(NAV_NEXT.includes(k)){ e.preventDefault(); next(); }
  else if(NAV_PREV.includes(k)){ e.preventDefault(); prev(); }
  else if(k==="Home"){ show(0); }
  else if(k==="End"){ show(els.length-1); }
  else return false;
  return true;
}
const hashNum = () => parseInt(location.hash.slice(1),10);

/* ── 청중 화면 ── */
function openPresenter(quiet){
  pwin = window.open(FILE + "?presenter#" + (cur+1), "presenter-" + FILE, "width=1200,height=800");
  if(!pwin && !quiet) alert("팝업이 차단되었습니다. 주소창에서 이 사이트의 팝업을 허용한 뒤 다시 P를 눌러 주세요.");
  else if(pwin) pwin.focus();
}
if(MODE === "audience"){
  document.addEventListener("keydown", e=>{
    if(navKey(e)) return;
    const k = e.key.toLowerCase();
    if(k==="p") openPresenter();
    else if(k==="h") location.href = "./";
    else if(k==="f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  });
  $("openP").addEventListener("click", ()=>openPresenter());
  document.addEventListener("click", e=>{
    if(e.target.closest("#home,#openP")) return;
    (e.clientX < innerWidth/3) ? prev() : next();
  });
  let sx = null;
  document.addEventListener("touchstart", e=>{ sx = e.touches[0].clientX; }, {passive:true});
  document.addEventListener("touchend", e=>{
    if(sx===null) return;
    const dx = e.changedTouches[0].clientX - sx;
    if(Math.abs(dx) > 50){ dx < 0 ? next() : prev(); }
    sx = null;
  });
  /* 마우스를 3초간 움직이지 않으면 버튼과 커서를 숨김 */
  let idleT;
  const wake = ()=>{ document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(()=>document.body.classList.add("idle"), 3000); };
  document.addEventListener("mousemove", wake); wake();
  show(isNaN(hashNum()) ? 0 : hashNum()-1, true);
  send({type:"hello"});
  if(Q.has("notes")) openPresenter(true);
}

/* ── 미리보기(iframe) ── */
if(MODE === "view"){
  addEventListener("hashchange", ()=>show((hashNum()||1)-1));
  show((hashNum()||1)-1);
}

/* ── 발표자 창 ── */
let running = false, accMs = 0, t0 = 0, noteSize = 26;
const elapsed = () => (accMs + (running ? Date.now() - t0 : 0)) / 1000;
try{ noteSize = +localStorage.getItem("deck-note-size") || 26; }catch(e){}

function renderConn(){
  const c = $("pvconn");
  c.className = linked ? "on" : "off";
  c.textContent = linked ? "● 청중 화면 연결됨" : "○ 청중 화면 대기 중 — 슬라이드 탭에서 P";
}
function renderClock(){
  const s = S[cur], e = elapsed();
  $("pclock").textContent = fmt(e);
  $("pnow").textContent = new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
  $("pplan").textContent = `배정 ${fmt(s.time)} · 계획 ${fmt(s.start)}~${fmt(s.end)} / 총 ${fmt(TOTAL)}`;
  let st = "";
  if(running || e > 0){
    const d = Math.round(e - s.start);
    st = Math.abs(d) <= 10 ? `<span class="ok">일정대로</span>`
       : d > 0 ? `<span class="late">+${fmt(d)} 지연</span>` : `<span class="ok">−${fmt(-d)} 여유</span>`;
  }else st = "T 또는 ‘타이머 시작’";
  $("pstate").innerHTML = st;
  const tb = $("ptimer");
  tb.textContent = running ? "타이머 정지" : (e > 0 ? "타이머 계속" : "타이머 시작");
  tb.classList.toggle("on", running);
}
function renderPresenter(){
  $("ppos").textContent = (cur+1) + " / " + S.length;
  $("fcur").src = FILE + "?view#" + (cur+1);
  const hasNext = cur < S.length-1;
  $("fnext").parentElement.parentElement.style.display = hasNext ? "" : "none";
  if(hasNext) $("fnext").src = FILE + "?view#" + (cur+2);
  $("pvnextkey").textContent = hasNext ? "다음 핵심 한 줄 · " + S[cur+1].key : "마지막 슬라이드입니다.";
  $("pvnote").textContent = S[cur].note;
  $("pvnote").style.fontSize = noteSize + "px";
  $("pvnote").scrollTop = 0;
  renderClock();
}
function timer(a){
  if(a==="toggle"){ if(running){ accMs += Date.now() - t0; running = false; } else { t0 = Date.now(); running = true; } }
  else { running = false; accMs = 0; }
  renderClock();
}
function zoom(d){
  noteSize = Math.max(16, Math.min(48, noteSize + d));
  $("pvnote").style.fontSize = noteSize + "px";
  try{ localStorage.setItem("deck-note-size", noteSize); }catch(e){}
}
if(MODE === "presenter"){
  document.title = "발표자 창 · " + document.title;
  $("pvhd").innerHTML =
    `<span class="clock" id="pclock"></span><span class="pos" id="ppos"></span>` +
    `<span id="pplan"></span><span id="pstate"></span><span>현재 시각 <b id="pnow"></b></span><span id="pvconn"></span>` +
    `<span class="sp"></span>` +
    `<button class="pbtn" data-a="prev">◀ 이전</button><button class="pbtn" data-a="next">다음 ▶</button>` +
    `<button class="pbtn" data-a="timer" id="ptimer"></button><button class="pbtn" data-a="reset">리셋</button>` +
    `<button class="pbtn" data-a="small" title="원고 글자 작게 (−)">가−</button><button class="pbtn" data-a="big" title="원고 글자 크게 (+)">가+</button>`;
  $("pvhd").addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    b.blur();
    ({prev, next, timer:()=>timer("toggle"), reset:()=>timer("reset"), small:()=>zoom(-2), big:()=>zoom(2)})[b.dataset.a]();
  });
  document.addEventListener("keydown", e=>{
    if(navKey(e)) return;
    const k = e.key.toLowerCase();
    if(k==="t") timer("toggle");
    else if(k==="r") timer("reset");
    else if(k==="+" || k==="=") zoom(2);
    else if(k==="-") zoom(-2);
  });
  setInterval(renderClock, 500);
  show(isNaN(hashNum()) ? 0 : hashNum()-1, true);
  renderConn();
  send({type:"hello"});
}
</script>
</body>
</html>
