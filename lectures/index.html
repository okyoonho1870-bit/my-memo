<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의 슬라이드 목록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1b2a; --bg2:#13283d; --card:#112437; --ink:#f6f1e4; --muted:#b9c4d0;
    --gold:#e3b75b; --line:rgba(227,183,91,.35); --ok:#9be0b0; --wait:#ffc98a;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--ink);
    background:radial-gradient(ellipse at 20% 0%,var(--bg2),var(--bg) 60%) fixed,var(--bg);
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
  .wrap{max-width:1040px;margin:0 auto;padding:48px 16px 80px}
  header{border-bottom:2px solid var(--line);padding-bottom:24px;margin-bottom:28px}
  .eyebrow{color:var(--gold);font-weight:700;letter-spacing:.14em;font-size:13px;margin-bottom:10px}
  h1{font-family:"Noto Serif KR",serif;font-size:clamp(28px,5vw,40px);margin:0 0 18px;color:var(--gold)}
  .stats{display:flex;gap:28px;flex-wrap:wrap;color:var(--muted);font-size:14px}
  .stats b{display:block;color:var(--ink);font-size:24px;font-family:"Noto Serif KR",serif}

  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:28px}
  .tools input{flex:1 1 240px;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:11px 14px;font:inherit;font-size:15px}
  .tools input:focus{outline:2px solid var(--gold);outline-offset:1px}
  .chip{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;
    padding:9px 16px;font:inherit;font-size:14px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}

  h2{font-family:"Noto Serif KR",serif;font-size:20px;margin:36px 0 14px;display:flex;gap:10px;align-items:baseline}
  h2 small{font-family:"Noto Sans KR",sans-serif;color:var(--muted);font-size:13px;font-weight:400}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:4px 14px 14px 4px;
    padding:20px 20px 18px;display:flex;flex-direction:column;gap:10px}
  .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
  .badge{font-weight:700;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid currentColor}
  .badge.done{color:var(--ok)} .badge.wait{color:var(--wait)}
  .chapter{font-size:13px;color:var(--gold)}
  .card h3{font-family:"Noto Serif KR",serif;font-size:20px;margin:0;line-height:1.35}
  .summary{color:var(--muted);font-size:14px;line-height:1.6;margin:0}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tags span{font-size:12px;color:var(--muted);background:rgba(227,183,91,.08);border-radius:6px;padding:3px 8px}
  .facts{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
  .facts .seen{color:var(--gold)}
  .actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .btn{flex:1 1 auto;text-align:center;text-decoration:none;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700}
  .btn.main{background:var(--gold);color:#1a1405}
  .btn.sub{border:1px solid var(--line);color:var(--ink)}
  .btn:hover{filter:brightness(1.08)}
  .empty{color:var(--muted);text-align:center;padding:48px 0}

  details{margin-top:48px;border:1px solid var(--line);border-radius:12px;padding:14px 18px;color:var(--muted);font-size:14px;line-height:1.7}
  summary{cursor:pointer;color:var(--gold);font-weight:700}
  code{background:rgba(255,255,255,.07);border-radius:4px;padding:1px 5px;color:var(--ink)}
  footer{margin-top:28px;font-size:13px;color:var(--muted)}
  footer a{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">LECTURE SLIDES</div>
    <h1>강의 슬라이드 목록</h1>
    <div class="stats" id="stats"></div>
  </header>

  <div class="tools">
    <input id="q" type="search" placeholder="제목·장·태그로 찾기" aria-label="강의 검색">
    <button class="chip" data-f="전체" aria-pressed="true">전체</button>
    <button class="chip" data-f="완료" aria-pressed="false">완료</button>
    <button class="chip" data-f="준비중" aria-pressed="false">준비중</button>
  </div>

  <main id="list"></main>

  <details>
    <summary>새 강의 추가하는 방법</summary>
    <ol>
      <li>만든 슬라이드 HTML 파일을 <code>lectures</code> 폴더에 넣습니다. (예: <code>chambumo-1-2.html</code>)</li>
      <li><code>lectures/lectures.js</code>를 열고 기존 강의 한 덩어리 <code>{ … }</code>를 복사해 붙인 뒤 파일 이름·제목·시간 등을 고칩니다.</li>
      <li>저장(커밋)하면 이 목록에 바로 나타납니다.</li>
    </ol>
    슬라이드 안에서는 <code>←</code> <code>→</code> 넘김 · <code>F</code> 전체화면 · <code>P</code> 발표자 원고 · <code>T</code> 타이머 · <code>H</code> 목록으로.
  </details>
  <footer><a href="../">← 메모장으로</a></footer>
</div>

<script src="lectures.js"></script>
<script>
const ALL = (window.LECTURES || []).slice().sort((a,b)=> (a.series||"").localeCompare(b.series||"") || (a.file).localeCompare(b.file));
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem("lecture-seen")||"{}"); }catch(e){ return {}; } },
  set(file){ try{ const m = store.get(); m[file] = Date.now(); localStorage.setItem("lecture-seen", JSON.stringify(m)); }catch(e){} }
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let filter = "전체";

function renderStats(){
  const mins = ALL.reduce((n,l)=>n+(+l.minutes||0),0);
  const done = ALL.filter(l=>l.status==="완료").length;
  const series = new Set(ALL.map(l=>l.series)).size;
  document.getElementById("stats").innerHTML =
    `<div><b>${ALL.length}</b>강의</div><div><b>${series}</b>시리즈</div>` +
    `<div><b>${done}</b>완료</div><div><b>${Math.floor(mins/60)?Math.floor(mins/60)+"시간 ":""}${mins%60}분</b>총 강의 시간</div>`;
}

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const seen = store.get();
  const rows = ALL.filter(l =>
    (filter==="전체" || l.status===filter) &&
    (!q || [l.series,l.chapter,l.title,l.summary,...(l.tags||[])].join(" ").toLowerCase().includes(q)));
  const list = document.getElementById("list");
  if(!rows.length){ list.innerHTML = `<p class="empty">해당하는 강의가 없습니다.</p>`; return; }
  const groups = {};
  rows.forEach(l => (groups[l.series||"기타"] ||= []).push(l));
  list.innerHTML = Object.entries(groups).map(([name, ls]) => `
    <h2>${esc(name)} <small>${ls.length}강</small></h2>
    <div class="grid">${ls.map(l => `
      <article class="card">
        <div class="meta"><span>${esc(l.date||"")}</span>
          <span class="badge ${l.status==="완료"?"done":"wait"}">${esc(l.status||"준비중")}</span></div>
        ${l.chapter?`<div class="chapter">${esc(l.chapter)}</div>`:""}
        <h3>${esc(l.title)}</h3>
        ${l.summary?`<p class="summary">${esc(l.summary)}</p>`:""}
        ${(l.tags||[]).length?`<div class="tags">${l.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:""}
        <div class="facts">
          ${l.minutes?`<span>⏱ ${esc(l.minutes)}분</span>`:""}
          ${l.slides?`<span>▤ 슬라이드 ${esc(l.slides)}장</span>`:""}
          ${seen[l.file]?`<span class="seen">최근 열람 ${new Date(seen[l.file]).toLocaleDateString("ko-KR")}</span>`:""}
        </div>
        <div class="actions">
          <a class="btn main" href="${esc(l.file)}" data-file="${esc(l.file)}">발표 시작</a>
          <a class="btn sub" href="${esc(l.file)}?notes=1" data-file="${esc(l.file)}">발표자 모드</a>
        </div>
      </article>`).join("")}
    </div>`).join("");
}

document.getElementById("q").addEventListener("input", render);
document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c===b));
  render();
}));
document.getElementById("list").addEventListener("click", e => {
  const a = e.target.closest("a[data-file]");
  if(a) store.set(a.dataset.file);
});
renderStats();
render();
</script>
</body>
</html>
